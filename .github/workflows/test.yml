name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lockfile-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check:host-deps
      - run: npm run check:memory-core-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # 仓内解析走 memory-core 的源码（vitest alias + tsconfig paths），所以 `test` job 测的是逻辑。
  # 这个 job 把 alias 关掉，让 pi-memory 与 dsh-memory 的测试经包 exports 打到 memory-core/dist ——
  # 用户拿到的那条解析路径必须被真实执行一次，否则首次发布就是它的第一次运行。
  test-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core && npm run build -w dsh-memory
      # dsh 宿主包只允许 `import type`（零运行时 import）：dist/**/*.js 里必须零 @deepseek-ai
      # 命中。只 grep .js —— .d.ts 里出现宿主类型是合法的（type-only import 被 tsc 擦掉）。
      - name: Assert no @deepseek-ai runtime imports in dsh-memory dist
        run: |
          if grep -rq "@deepseek-ai" dsh-memory/dist --include="*.js"; then
            echo "::error::dsh-memory/dist contains a runtime @deepseek-ai import"
            grep -rn "@deepseek-ai" dsh-memory/dist --include="*.js"
            exit 1
          fi
      - run: npm test -w pi-memory
        env:
          MEMORY_CORE_FROM_DIST: "1"
      - run: npm test -w dsh-memory
        env:
          MEMORY_CORE_FROM_DIST: "1"

  # 上一个 job 打的是**仓内**的 memory-core/dist（workspace 符号链接）。用户机器上解析到的是
  # registry 上的那个版本，所以这里真装一次：把适配层打成 tarball，装进干净目录、依赖只从 registry
  # 拉，再断言解析到的 memory-core 在干净目录内、版本满足声明的范围、且能真读写。
  # 未发布的适配层（dsh-memory 目前 private: true）在 registry 上没有满足范围的版本时只打 notice 跳过；
  # 去掉 private 之后同一条件变成失败。
  registry-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core && npm run build -w dsh-memory
      - run: npm run smoke:registry

  # 20.16.0 是 memory-core 的 engines 下限（dsh 生态声明的最低宿主版本），24 是开发版本。
  # 这个 job 只验证运行时形状，不跑 vitest：开发工具链的 Node 下限高于 engines。
  pack-smoke:
    strategy:
      matrix:
        node: ["20.16.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core
      - run: npm pack -w memory-core --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
      - name: Assert the tarball carries dist and types, and no tests
        run: node scripts/assert-pack-manifest.mjs "$RUNNER_TEMP/pack.json" memory-core
      # pi-memory 以 TS 源码发布（`pi.extensions` 指向 index.ts），它是用户真正装的那个包；
      # 少带 index.ts 或 src/，装上就是个加载不起来的扩展，而别的 job 全绿。
      - run: npm pack -w pi-memory --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack-pi.json"
      - name: Assert the pi-memory tarball carries its TS entry point and sources
        run: node scripts/assert-pack-manifest.mjs "$RUNNER_TEMP/pack-pi.json" pi-memory
      # 必须在干净目录内执行 smoke：Node 的 ESM 解析跟随脚本位置，从仓库根执行会命中仓库自己的
      # workspace 符号链接（→ memory-core/dist），tarball 是空包也照样绿。
      # XDG_DATA_HOME 指向临时目录：defaultMemoryRoot() 在模块加载时求值，不设就会往真实数据根写。
      - name: Install the tarball into a clean directory and run the smoke
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --registry=https://registry.npmjs.org "$RUNNER_TEMP"/yandy0725-memory-core-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/pack-smoke.mjs" .
          XDG_DATA_HOME="$RUNNER_TEMP/xdg" node pack-smoke.mjs
