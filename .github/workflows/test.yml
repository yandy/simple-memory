name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # 分级闸门：算出这次改动能不能碰代码、能不能换产物，后面的 job 用 if 挂在这三个输出上。
  # 只改 `**/*.md` / `docs/**` 时三个输出全为 false，只剩这个 job 跑 —— 它就是 docs-only 的结论。
  # predicate-quantifier: some-with-excludes —— 文件命中任一正向规则且不命中任何排除规则才算数，
  # 否则 `code: ['**', '!**/*.md', ...]` 里的排除规则会被默认的 'some' 语义当成「也算命中」。
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.filter.outputs.code }}
      artifact: ${{ steps.filter.outputs.artifact }}
      manifest: ${{ steps.filter.outputs.manifest }}
    steps:
      # PR 事件走 REST API 不需要 checkout；push 到 main 时 paths-filter 用 git diff 算改动，
      # 深度不足会把「全部文件都算改动」当结果（全量跑，浪费但不漏）。仓库小，直接全历史。
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          predicate-quantifier: some-with-excludes
          filters: |
            # 任何非文档改动。文档 = 任何 .md 与 docs/ 下的文件：它们改不动代码。
            # 例外是随包发布的 README 与 dsh bundle 配置：它们不跑代码测试，但要跑产物冒烟（见 artifact）。
            code:
              - "**"
              - "!**/*.md"
              - "!docs/**"
            # 能改变「用户装到的东西」的路径：源码、package.json（exports/files/deps）、构建与打包配置、
            # 打包脚本、LICENSE（tarball 里的副本由 prepack 生成）、以及 CI 自身（改闸门就要跑全量验证）。
            # **新增顶层源目录或新的构建配置文件时必须加进来**，否则 tier2 冒烟会在相关改动上静默跳过。
            # */vitest.config.ts 是 test-dist 的 alias 开关（MEMORY_CORE_FROM_DIST），不能漏。
            artifact:
              - "package.json"
              - "package-lock.json"
              - "*/package.json"
              - "tsconfig.base.json"
              - "*/tsconfig*.json"
              - "vitest.config.ts"
              - "*/vitest.config.ts"
              - "LICENSE"
              # 随包发布的 README（npm 总是把它们打进 tarball，assert-pack-manifest 要求存在）。
              - "*/README*.md"
              # dsh bundle 的插入配置：同时在 files、exports 与 dsh.bundle.patch 里。
              - "dsh-memory/cordis.patch.yml"
              - "scripts/**"
              - "*/src/**"
              - "*/index.ts"
              - ".github/workflows/**"
            # 只影响依赖图：package.json 的 deps 变了 lockfile 就该跟着变。
            manifest:
              - "package.json"
              - "*/package.json"
              - "package-lock.json"

  lockfile-sync:
    needs: changes
    if: needs.changes.outputs.manifest == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          git diff --exit-code -- package-lock.json

  test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      # 三条 check 是纯 Node 脚本，与平台无关：只在 ubuntu 腿跑，Windows 腿只管平台相关的事。
      - run: npm run check:license
        if: runner.os == 'Linux'
      - run: npm run check:host-deps
        if: runner.os == 'Linux'
      - run: npm run check:memory-core-deps
        if: runner.os == 'Linux'
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test

  # 仓内解析走 memory-core 的源码（vitest alias + tsconfig paths），所以 `test` job 测的是逻辑。
  # 这个 job 把 alias 关掉，让 pi-memory 与 dsh-memory 的测试经包 exports 打到 memory-core/dist ——
  # 用户拿到的那条解析路径必须被真实执行一次，否则首次发布就是它的第一次运行。
  test-dist:
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core && npm run build -w dsh-memory
      # dsh 宿主包只允许 `import type`（零运行时 import）：dist/**/*.js 里必须零 @deepseek-ai
      # 命中。只 grep .js —— .d.ts 里出现宿主类型是合法的（type-only import 被 tsc 擦掉）。
      - name: Assert no @deepseek-ai runtime imports in dsh-memory dist
        run: |
          if grep -rq "@deepseek-ai" dsh-memory/dist --include="*.js"; then
            echo "::error::dsh-memory/dist contains a runtime @deepseek-ai import"
            grep -rn "@deepseek-ai" dsh-memory/dist --include="*.js"
            exit 1
          fi
      - run: npm test -w pi-memory
        env:
          MEMORY_CORE_FROM_DIST: "1"
      - run: npm test -w dsh-memory
        env:
          MEMORY_CORE_FROM_DIST: "1"

  # 上一个 job 打的是**仓内**的 memory-core/dist（workspace 符号链接）。用户机器上解析到的是
  # registry 上的那个版本，所以这里真装一次：把适配层打成 tarball，装进干净目录、依赖只从 registry
  # 拉，再断言解析到的 memory-core 在干净目录内、版本满足声明的范围、且能真读写。
  # 未发布的适配层（dsh-memory 目前 private: true）在 registry 上没有满足范围的版本时只打 notice 跳过；
  # 去掉 private 之后同一条件变成失败。
  # PR 上 core 可能尚未发布：用仓内 tarball 与适配层 tarball 在干净目录里同时安装，验证发布形态与
  # 实际解析，不把 workspace 链接或 registry 可用性当成前提。输出明确标为 workspace，不冒充 registry。
  workspace-smoke:
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core && npm run build -w dsh-memory
      - run: npm run smoke:workspace

  # registry 路径只在 main 上验：PR 阶段尚未发布的 core 客观上没有这条路径可验，不能假装通过。
  registry-smoke:
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.artifact == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core && npm run build -w dsh-memory
      - run: npm run smoke:registry

  # 20.16.0 是 memory-core 的 engines 下限（dsh 生态声明的最低宿主版本），24 是开发版本。
  # 这个 job 只验证运行时形状，不跑 vitest：开发工具链的 Node 下限高于 engines。
  pack-smoke:
    needs: changes
    if: needs.changes.outputs.artifact == 'true'
    strategy:
      matrix:
        node: ["20.16.0", "24"]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run build -w memory-core
      - run: npm pack -w memory-core --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack.json"
      - name: Assert the tarball carries dist and types, and no tests
        run: node scripts/assert-pack-manifest.mjs "$RUNNER_TEMP/pack.json" memory-core
      # pi-memory 以 TS 源码发布（`pi.extensions` 指向 index.ts），它是用户真正装的那个包；
      # 少带 index.ts 或 src/，装上就是个加载不起来的扩展，而别的 job 全绿。
      - run: npm pack -w pi-memory --pack-destination "$RUNNER_TEMP" --json > "$RUNNER_TEMP/pack-pi.json"
      - name: Assert the pi-memory tarball carries its TS entry point and sources
        run: node scripts/assert-pack-manifest.mjs "$RUNNER_TEMP/pack-pi.json" pi-memory
      # 必须在干净目录内执行 smoke：Node 的 ESM 解析跟随脚本位置，从仓库根执行会命中仓库自己的
      # workspace 符号链接（→ memory-core/dist），tarball 是空包也照样绿。
      # XDG_DATA_HOME 指向临时目录：defaultMemoryRoot() 在模块加载时求值，不设就会往真实数据根写。
      - name: Install the tarball into a clean directory and run the smoke
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install --registry=https://registry.npmjs.org "$RUNNER_TEMP"/yandy0725-memory-core-*.tgz
          cp "$GITHUB_WORKSPACE/scripts/pack-smoke.mjs" .
          XDG_DATA_HOME="$RUNNER_TEMP/xdg" node pack-smoke.mjs
